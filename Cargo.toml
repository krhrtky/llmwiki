[package]
name = "llmwiki"
version = "0.2.0"
edition = "2021"
description = "Personal LLM Wiki initializer and structural verifier"
license = "MIT"
include = [
    "Cargo.toml",
    "Cargo.lock",
    "README.md",
    "rust-toolchain.toml",
    "src/**",
    "skills/llmwiki/**",
    "templates/personal/**",
    "templates/personal/.llmwiki/manifest.json",
    "templates/personal/raw/.gitkeep",
    "templates/personal/wiki/analyses/.gitkeep",
    "templates/personal/wiki/concepts/.gitkeep",
    "templates/personal/wiki/entities/.gitkeep",
    "templates/personal/wiki/projects/.gitkeep",
    "templates/personal/wiki/sources/.gitkeep",
]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
include_dir = "0.7"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "2.0"
tempfile = "3.12"
unicode-casefold = "0.2"
walkdir = "2.5"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
